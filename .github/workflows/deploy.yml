name: Build y publicar rama deploy

# El sitio se sirve desde Hostinger, que clona la rama `deploy` (contenido
# ya construido, index.html en la raíz). Cada push a main la regenera.

# ⚠ DISPARO AUTOMÁTICO DESACTIVADO A PROPÓSITO.
# El deploy de Git de Hostinger está apuntando a `public_html` (la raíz del
# dominio institucional) en vez de `public_html/landing`. Mientras eso no se
# corrija en hPanel, cada push a `deploy` pisa tamaba.edu.ar.
# Reactivar el bloque `push:` SOLO después de verificar en
# hPanel → Avanzado → GIT que el "Directorio root" dice public_html/landing.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-y-publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build con verificaciones
        run: node build.mjs --check

      - name: Publicar dist/ en la rama deploy
        run: |
          cd dist
          git init -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy: ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" deploy
